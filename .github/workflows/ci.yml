name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Format
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  module:
    name: Guest module and worker oracle
    runs-on: ubuntu-latest
    env:
      # The AII OS release whose worker and verifier the oracle runs on,
      # pinned by hash.
      AII_OS_VERSION: "0.1.8"
      AII_OS_SHA256: "06cbd6c283cdcfe498f471721322c5feb709293808a383bc80fc45e83f2b08b4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"
      - name: Build the guest module
        run: go tool aiisdk build
      - name: Package
        run: go tool aiisdk package
      - name: Fetch the AII OS release
        run: |
          curl -sSL -o aii-os.tar.gz "https://github.com/aiii-dot-id/aii-os/releases/download/v${AII_OS_VERSION}/aii-os_${AII_OS_VERSION}_linux_amd64.tar.gz"
          echo "${AII_OS_SHA256}  aii-os.tar.gz" | sha256sum -c -
          mkdir -p oracle && tar -xzf aii-os.tar.gz -C oracle
      - name: Worker oracle (the sandbox and Jev's host)
        run: AII_OS_BIN="$PWD/oracle" go tool aiisdk test -grant "files=$PWD/testdata/tree" -grant net.outbound:api.typesafe.ai:443 -skip-build
